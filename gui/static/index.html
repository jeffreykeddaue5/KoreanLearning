<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korean Mentor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="start" hidden>
  <h1 id="day">…</h1>
  <p id="meta" class="dim"></p>
  <ul id="blocks"></ul>
  <p id="missed" class="dim"></p>
  <div id="choices"></div>
  <p class="dim small">Listening, podcast and lesson blocks stay in the terminal.</p>
</section>

<section id="game" hidden>
  <header>
    <span id="gTitle"></span>
    <span id="gScore" class="dim"></span>
    <button id="gQuit" title="Back to start">✕</button>
  </header>
  <div id="gBar"><div id="gFill"></div></div>
  <main id="gStage"></main>
</section>

<section id="chat" hidden>
  <header>
    <div id="clock" hidden>
      <svg id="ring" width="44" height="44" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="20" class="track"></circle>
        <circle id="ringFill" cx="24" cy="24" r="20" class="fill" transform="rotate(-90 24 24)"></circle>
      </svg>
      <div class="clockText"><span id="timer"></span><span id="goal" class="small"></span></div>
    </div>
    <span id="nav"><button id="prev" aria-label="Earlier question" title="Earlier question (Alt+←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><span id="dots"></span><button id="next" aria-label="Later question" title="Later question (Alt+→)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></span>
    <span id="status" class="dim"></span>
    <button id="histBtn" title="Everything said so far">History</button>
    <button id="end" title="Stop for today (그만)">그만</button>
  </header>
  <ol id="steps" aria-label="Steps" hidden>
    <li data-step="listen">Listen</li><li data-step="speak">Speak</li><li data-step="type">Type</li><li data-step="feedback">Feedback</li>
  </ol>

  <main id="stage">
    <div id="hud" hidden></div>
    <div id="story" hidden></div>
    <div id="picture">
      <div id="scene"></div>
      <div id="speakerBox"><div id="speaker"></div><div id="bubble" hidden></div></div>
    </div>
    <div id="card"><p class="dim typing">getting ready</p></div>
    <div id="note"></div>
  </main>

  <aside id="history" hidden></aside>

  <footer id="bar">
    <div id="actions">
      <button id="rec" aria-pressed="false" title="Record your answer (Alt+R). Pressing it again saves the take; the next press replaces it.">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="recLabel">Record</span> <kbd>Alt R</kbd>
      </button>
      <span id="take"></span>
      <span id="recHelp" class="dim small"></span>
      <button id="done" class="primary"><span id="doneLabel">Done speaking</span> <kbd>Ctrl Space</kbd></button>
      <button id="typeInstead" class="link">Type instead</button>
    </div>
    <div id="typing">
      <label for="input" id="inputLabel" class="dim small">Your answer</label>
      <div class="row">
        <textarea id="input" rows="2" placeholder="대답 · Enter = send · Shift+Enter = new line"></textarea>
        <button id="send">Send <kbd>Enter</kbd></button>
      </div>
    </div>
  </footer>
  <div id="closed" hidden>
    <p>Session ended.</p>
    <button id="home">Back to start</button>
  </div>
</section>

<script src="app.js"></script>
<script src="game.js"></script>
</body>
</html>
